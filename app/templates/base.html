<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<header class="nav">

    <a
        class="brand"
        href="/"
    >
        PocketSmart AI
    </a>

    <nav>

        {% if user %}

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/history">
            History
        </a>

        <a href="/planner/home">
            Home
        </a>

        <a href="/planner/party">
            Party
        </a>

        <a href="/planner/jewelry">
            Jewelry
        </a>

        <a href="/logout">
            Logout
        </a>

        {% else %}

        <a href="/login">
            Login
        </a>

        <a
            class="btn small"
            href="/register"
        >
            Register
        </a>

        {% endif %}

    </nav>

</header>


<main class="container">

{% block content %}
{% endblock %}

</main>


<footer>

    © 2026 PocketSmart AI

    · AI recommendations are estimates,
    not live prices.

</footer>


<script src="/static/js/app.js"></script>

{% block scripts %}
{% endblock %}

</body>

</html>
